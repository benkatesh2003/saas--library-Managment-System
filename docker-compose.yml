services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-sathi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - library-sathi-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: 
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_APP_NAME: ${VITE_APP_NAME:-Library Sathi}
    container_name: library-sathi-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - library-sathi-net

networks:
  library-sathi-net:
    driver: bridge

volumes:
  backend-uploads:
